name: Could not set up
description: The install did not finish, or a tool will not run
title: "Could not set up: "
labels: ["❌ Could Not Setup"]
body:
  - type: markdown
    attributes:
      value: |
        ### Do not paste lab code here

        This repository is public and it holds no course material by
        design. Please do not paste your Verilog, your assembly, a lab
        handout or anything from a lab PDF into this issue, even to show
        an error. If a build failed on your own source, describe what it
        was doing and paste the tool's message, not the file.

        Everything below is about the toolchain, not your design.

  - type: textarea
    id: report
    attributes:
      label: cpen-setup --report
      description: |
        Run this on your Mac and paste the whole thing. It already comes
        wrapped in a code block, so paste it as it is.

        ```
        cpen-setup --report
        ```

        If the install never got as far as adding itself to your PATH, or
        you used `--no-path`, `cd` to the folder you cloned and run
        `./bin/cpen-setup --report` instead. It works on a machine with
        none of this installed.

        It changes nothing, it never reads your licence file or your VNC
        password, and it replaces your home directory and username before
        printing.
    validations:
      required: true

  - type: dropdown
    id: route
    attributes:
      label: How were you installing
      options:
        - cpen-setup
        - docs/SETUP.md, by hand
        - Started with SETUP.md, switched to cpen-setup
        - Started with cpen-setup, switched to SETUP.md
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Which step
      description: |
        The section of docs/SETUP.md, or the `cpen-setup` line it stopped
        on. For example "4.2 Run the installer", or "no RISC-V compiler".
      placeholder: "4.3 Patching Quartus"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: What you ran, and what it printed
      description: |
        The command and the error, copied rather than screenshotted so it
        can be searched. If it is long, the last 30 lines are usually the
        useful part.
      render: shell
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: What you have already tried
      description: |
        Optional. Anything from
        [TROUBLESHOOTING.md](https://github.com/Horse-5-333/cpen-tools/blob/main/docs/TROUBLESHOOTING.md)
        you worked through, and whether it changed anything.
    validations:
      required: false

  - type: checkboxes
    id: confirm
    attributes:
      label: Before you post
      options:
        - label: There is no lab code, handout text or solution in this issue.
          required: true
        - label: I re-ran `cpen-setup` after fixing anything it told me to fix.
          required: false
